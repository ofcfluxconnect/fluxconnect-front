<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Agenda - FluxConnect Profissional</title>
    <script src="../compartilhado/recepcao_tema.js"></script>
    <!-- a base e o visual sao os mesmos das telas do paciente e da recepcao -->
    <link rel="stylesheet" href="../compartilhado/paciente_base.css" />
    <link rel="stylesheet" href="../compartilhado/recepcao_visual.css" />
    <link rel="stylesheet" href="../compartilhado/paciente_visual.css" />
    <link rel="stylesheet" href="../compartilhado/profissional_visual.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../compartilhado/recepcao_tema_escuro.css" />
    <link rel="stylesheet" href="../compartilhado/celular.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="rv" data-perfil="profissional" data-notificacoes="profissional">
    <!-- Barra lateral do profissional -->
    <aside class="sidebar">
      <div class="logo-container">
        <img src="../../midias/logo/fluxConnect_2_transparente.svg" alt="Logo FluxConnect" class="logo-fluxconnect" />
        <div>
          <p class="logo-nome">FluxConnect</p>
          <p class="logo-subtitulo">Área do Profissional</p>
        </div>
      </div>

      <nav class="nav-links" aria-label="Menu do profissional">
        <a href="../tela_principal_profissional/index.html" class="link-ativo" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Minha agenda</span>
        </a>
        <a href="../prontuarios_profissional/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>Prontuários</span>
        </a>
        <a href="../resultados_profissional/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Resultados</span>
        </a>
        <a href="../meu_perfil_profissional/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Meu Perfil</span>
        </a>
      </nav>

      <!-- Clicar abre o menu com "Meu perfil" e "Sair da conta" -->
      <button type="button" class="container-user" data-menu-usuario aria-label="Opções da conta" title="Opções da conta">
        <span class="avatar-user" aria-hidden="true" data-perfil="iniciais">--</span>
        <span class="info-user">
          <span class="nome-user" data-perfil="nome">Profissional</span>
          <span class="tipo-user" data-perfil="especialidade"></span>
        </span>
      </button>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div>
          <nav class="migalha" aria-label="Você está em">
            <a href="../tela_principal_profissional/index.html" title="Minha agenda" aria-label="Voltar à agenda"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
            <span aria-hidden="true">/</span>
            <span>Minha agenda</span>
          </nav>
          <h1 class="titulo-pagina" id="tituloPagina">Olá</h1>
          <p class="subtitulo-pagina" id="subtituloPagina"></p>
        </div>
        <div class="topo-direita">
          <div class="icones-topo">
            <button type="button" class="btn-topo" title="Notificações">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="ponto-notificacao"></span>
            </button>
            <button type="button" class="btn-topo btn-tema" data-alternar-tema title="Usar tema escuro" aria-label="Usar tema escuro" aria-pressed="false">
              <svg class="icone-lua" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg class="icone-sol" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
            </button>
          </div>
          <a class="btn-primario btn-grande so-computador" href="../prontuarios_profissional/index.html">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Prontuários
          </a>
        </div>
      </header>

      <div class="area-pagina">
        <!-- Resumo do dia -->
        <div class="cards-stat cards-quatro">
          <div class="card-stat stat-azul">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
            <div class="stat-texto">
              <p class="stat-rotulo">Total do dia</p>
              <p class="stat-numero" id="resTotal">0</p>
              <p class="stat-sub">atendimentos</p>
            </div>
          </div>
          <div class="card-stat stat-amarelo">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>
            <div class="stat-texto">
              <p class="stat-rotulo">Aguardando</p>
              <p class="stat-numero" id="resAguardando">0</p>
              <p class="stat-sub">na fila</p>
            </div>
          </div>
          <div class="card-stat stat-verde">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7.5"/></svg></span>
            <div class="stat-texto">
              <p class="stat-rotulo">Finalizados</p>
              <p class="stat-numero" id="resFinalizados">0</p>
              <p class="stat-sub">atendidos hoje</p>
            </div>
          </div>
          <div class="card-stat stat-vermelho">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></span>
            <div class="stat-texto">
              <p class="stat-rotulo">Cancelados</p>
              <p class="stat-numero" id="resCancelados">0</p>
              <p class="stat-sub">hoje</p>
            </div>
          </div>
        </div>

        <div class="grade-agenda">
          <!-- Horarios de hoje -->
          <section class="caixa" aria-labelledby="tituloAgenda">
            <div class="caixa-cabeca">
              <h2 class="caixa-titulo" id="tituloAgenda">Agenda de hoje</h2>
              <a class="link-ver" href="../resultados_profissional/index.html">Ver resultados de exames</a>
            </div>
            <div class="barra-ferramentas">
            <div class="campo-busca">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="search" autocomplete="off" id="inputBusca" placeholder="Buscar paciente por nome ou CPF..." aria-label="Buscar paciente por nome ou CPF..." />
            </div>
            </div>
            <ul class="lista-agenda" id="listaAgenda" aria-live="polite"></ul>
          </section>

          <!-- Proximo paciente (ou o que foi clicado na agenda) -->
          <aside class="caixa painel-paciente" aria-labelledby="txtRotuloPaciente">
            <p class="painel-rotulo" id="txtRotuloPaciente">Próximo paciente</p>
            <div id="painelPaciente"></div>
          </aside>
        </div>
      </div>
    </main>

    <script src="../compartilhado/pacientes_profissional.js"></script>
    <script src="../compartilhado/profissional_dados.js"></script>
    <script src="../compartilhado/recepcao_layout.js"></script>
    <script src="../compartilhado/recepcao_componentes.js"></script>
    <script src="../compartilhado/notificacoes.js"></script>
    <script src="../compartilhado/confirmacao.js"></script>
    <script src="../compartilhado/perfil_profissional.js"></script>
    <script src="../compartilhado/receita_visualizar.js"></script>
    <script src="../compartilhado/prontuario_modal.js"></script>
    <script src="script.js"></script>
  </body>
</html>
