<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas Consultas - FluxConnect Paciente</title>
    <script src="../compartilhado/recepcao_tema.js"></script>
    <link rel="stylesheet" href="../compartilhado/paciente_base.css" />
    <link rel="stylesheet" href="../compartilhado/recepcao_visual.css" />
    <link rel="stylesheet" href="../compartilhado/paciente_visual.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../compartilhado/recepcao_tema_escuro.css" />
    <link rel="stylesheet" href="../compartilhado/celular.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="rv" data-perfil="paciente" data-notificacoes="paciente">
    <!-- Barra lateral do paciente (no celular vira a barra de baixo) -->
    <aside class="sidebar">
      <div class="logo-container">
        <img src="../../midias/logo/fluxConnect_2_transparente.svg" alt="Logo FluxConnect" class="logo-fluxconnect" />
        <div>
          <p class="logo-nome">FluxConnect</p>
          <p class="logo-subtitulo">Portal do Paciente</p>
        </div>
      </div>

      <nav class="nav-links" aria-label="Menu do paciente">
        <a href="../tela_principal_paciente/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Início</span>
        </a>
        <a href="../Consultas/index.html" class="link-ativo" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.6A2 2 0 1 0 3 6h3a2 2 0 1 0-1.8-3.4"/><path d="M4.5 6v5a5.5 5.5 0 0 0 11 0V6"/><path d="M19.5 13a2.5 2.5 0 1 0 0 5"/><path d="M22 15.5v2A4.5 4.5 0 0 1 17.5 22h-1A4.5 4.5 0 0 1 12 17.5"/></svg>
          <span>Consultas</span>
        </a>
        <a href="../tela_principal_paciente/tela_meus_exames/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V2"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
          <span>Exames</span>
        </a>
        <a href="../historico_medico/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><polyline points="3 3 3 8 8 8"/><polyline points="12 7 12 12 15.5 14"/></svg>
          <span>Histórico</span>
        </a>
        <a href="../tela_conta_paciente/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Minha Conta</span>
        </a>
      </nav>

      <!-- Clicar abre o menu com "Minha conta" e "Sair da conta" -->
      <button type="button" class="container-user" data-menu-usuario aria-label="Opções da conta" title="Opções da conta">
        <span class="avatar-user" aria-hidden="true" data-paciente="iniciais">--</span>
        <span class="info-user">
          <span class="nome-user" data-paciente="nome-curto">Paciente</span>
          <span class="tipo-user">Paciente</span>
        </span>
      </button>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div>
          <nav class="migalha" aria-label="Você está em">
            <a href="../tela_principal_paciente/index.html" title="Início" aria-label="Voltar ao início"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
            <span aria-hidden="true">/</span>
            <span>Consultas</span>
          </nav>
          <h1 class="titulo-pagina" id="tituloPagina">Minhas Consultas</h1>
          <p class="subtitulo-pagina" id="subtituloPagina">Gerencie seus agendamentos e acompanhe seus atendimentos.</p>
        </div>
        <div class="topo-direita">
          <div class="icones-topo">
            <button type="button" class="btn-topo" title="Notificações">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="ponto-notificacao"></span>
            </button>
            <button type="button" class="btn-topo btn-tema" data-alternar-tema title="Usar tema escuro" aria-label="Usar tema escuro" aria-pressed="false">
              <svg class="icone-lua" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg class="icone-sol" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
            </button>
          </div>
          <a class="btn-primario btn-grande" href="../agendar_consulta/index.html">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Novo Agendamento
          </a>
        </div>
      </header>

      <div class="area-pagina">
        <!-- Resumo: clicar num card mostra aquela lista -->
        <div class="cards-stat">
          <button class="card-stat stat-azul" type="button" data-aba="proximas" aria-pressed="false">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
            <span class="stat-texto">
              <span class="stat-rotulo">Próximas</span>
              <span class="stat-numero" id="numProximas">0</span>
              <span class="stat-sub">agendadas</span>
            </span>
            <svg class="stat-grafico" id="grafProximas" role="img" aria-label="Consultas agendadas por semana"><title>Consultas agendadas por semana</title></svg>
          </button>
          <button class="card-stat stat-verde" type="button" data-aba="realizadas" aria-pressed="false">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7.5"/></svg></span>
            <span class="stat-texto">
              <span class="stat-rotulo">Realizadas</span>
              <span class="stat-numero" id="numRealizadas">0</span>
              <span class="stat-sub">atendimentos</span>
            </span>
            <svg class="stat-grafico" id="grafRealizadas" role="img" aria-label="Consultas realizadas por mês"><title>Consultas realizadas por mês</title></svg>
          </button>
          <button class="card-stat stat-vermelho" type="button" data-aba="canceladas" aria-pressed="false">
            <span class="stat-icone" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></span>
            <span class="stat-texto">
              <span class="stat-rotulo">Canceladas</span>
              <span class="stat-numero" id="numCanceladas">0</span>
              <span class="stat-sub">no total</span>
            </span>
            <svg class="stat-grafico" id="grafCanceladas" role="img" aria-label="Consultas canceladas por mês"><title>Consultas canceladas por mês</title></svg>
          </button>
        </div>

        <section class="caixa" aria-label="Lista de consultas">
          <div class="cabeca-lista">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <div>
              <h2>Seus agendamentos</h2>
              <p>Reagende, cancele ou veja os detalhes de cada consulta.</p>
            </div>
            <span class="chip-registros" id="chipRegistros"></span>
          </div>
          <div class="barra-ferramentas sem-linha">
            <div class="campo-busca">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="search" autocomplete="off" id="busca" placeholder="Buscar por médico, especialidade ou local" aria-label="Buscar por médico, especialidade ou local" />
            </div>
            <select class="select-filtro" id="filtroEspecialidade" aria-label="Filtrar por especialidade">
              <option value="">Todas as especialidades</option>
            </select>
          </div>
          <div class="barra-ferramentas">
            <div class="filtros" role="group" aria-label="Situação das consultas">
              <button type="button" class="filtro ativo" data-aba="proximas" aria-pressed="true">Próximas <span id="contProximas">0</span></button>
              <button type="button" class="filtro" data-aba="realizadas" aria-pressed="false">Realizadas <span id="contRealizadas">0</span></button>
              <button type="button" class="filtro" data-aba="canceladas" aria-pressed="false">Canceladas <span id="contCanceladas">0</span></button>
            </div>
          </div>
          <ul class="lista-cartoes" id="listaConsultas" aria-live="polite"></ul>
          <div class="rodape-tabela">
            <span id="textoRodape"></span>
            <nav class="paginacao" id="paginacao" aria-label="Páginas"></nav>
          </div>
        </section>
      </div>
    </main>

    <script src="../compartilhado/paciente_dados.js"></script>
    <script src="../compartilhado/recepcao_layout.js"></script>
    <script src="../compartilhado/recepcao_componentes.js"></script>
    <script src="../compartilhado/notificacoes.js"></script>
    <script src="../compartilhado/confirmacao.js"></script>
    <script src="../compartilhado/paciente_componentes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
