<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha - FluxConnect</title>
    <script src="../compartilhado/recepcao_tema.js"></script>
    <!-- mesmo visual da tela de login; style.css tem so o que muda aqui -->
    <link rel="stylesheet" href="../tela_login/fluxconnect_login_enxuto/style.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topo">
      <a class="marca" href="../tela_login/fluxconnect_login_enxuto/index.html" aria-label="FluxConnect — voltar para o login">
        <img src="../../midias/logo/fluxConnect_2_transparente.svg" alt="" width="54" height="48" />
        <div>
          <p class="marca-nome">FluxConnect</p>
          <p class="marca-sub">Conectando saúde</p>
        </div>
      </a>
      <button type="button" class="btn-topo btn-tema" data-alternar-tema title="Usar tema escuro" aria-label="Usar tema escuro" aria-pressed="false">
        <svg class="icone-lua" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icone-sol" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
      </button>
    </header>

    <main class="tela tela-centro">
      <section class="painel-login">
        <div class="cartao-login">
          <span class="cartao-icone" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
          </span>

          <header class="boas-vindas">
            <h1>Crie uma nova senha</h1>
            <p id="textoConta">Escolha uma senha diferente das que você já usou.</p>
          </header>

          <form id="formNovaSenha" novalidate>
            <div class="campo">
              <label for="senhaNova">Nova senha</label>
              <div class="entrada">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="senhaNova" name="novaSenha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required />
                <button type="button" class="btn-ver-senha" data-ver-senha aria-label="Mostrar senha" aria-pressed="false">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="campo">
              <label for="confirmarNovaSenha">Confirmar nova senha</label>
              <div class="entrada">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="confirmarNovaSenha" name="confirmarNovaSenha" placeholder="Repita a nova senha" autocomplete="new-password" required />
                <button type="button" class="btn-ver-senha" data-ver-senha aria-label="Mostrar senha" aria-pressed="false">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <p class="mensagem" id="mensagemSenha" role="status" aria-live="polite" hidden></p>

            <button class="btn-primario" id="btnSalvar" type="submit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 12.5 10 17.5 19 7.5"/></svg>
              Salvar nova senha
            </button>
          </form>

          <footer class="privacidade">
            <a class="link-voltar" href="../tela_login/fluxconnect_login_enxuto/index.html">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
              Voltar para o login
            </a>
          </footer>
        </div>
        <p class="copyright">© 2026 FluxConnect — Todos os direitos reservados</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
